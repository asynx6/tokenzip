name: Release
on:
  push:
    tags: ['v*']
jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm # Settings→Environments→npm + npm.com Trusted Publisher (see docs/trusted-publishing.md)
    permissions:
      contents: read
      id-token: write # OIDC for provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --provenance --access public
